<!doctype html>
    <html lang="es">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/archivo.css" rel="stylesheet">
<title>Práctica 33 - Informática General</title> 
    </head>
    <body>
        <div id="Cuerpo">
        <h1 id="Titulo">Corredores!</h1>
    
  <form id="formularioCorredores" action="#" method="post">

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre"><br>

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido"><br>

    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad"><br>

    <label for="numeroCorredor">Número de participante:</label>
    <input type="number" id="numeroCorredor" name="numeroCorredor"><br>

    <label for="tiempo">Tiempo (en minutos):</label>
    <input type="number" id="tiempo" name="tiempo"><br>

    <button type="button" id="btnGuardar">Guardar corredor</button>
    <button type="button" id="btnResultados" style="display:none;">Ver resultados</button>

  </form>

  <!-- Resultados, ocultos al inicio -->
  <div id="resultados" style="display:none;">

    <h2>Ganador</h2>
    <div id="ganador"></div>

    <h2>Promedio de tiempo</h2>
    <div id="promedio"></div>

    <h2>Más rápidos que el promedio</h2>
    <div id="porcentaje"></div>

  </div>


<script src="js/script.js"></script>
</div>
    </body>
    </html>
